# 관리자 화면의 '사이트에 반영' → Supabase Edge Function(request-publish) 이 이 워크플로를 실행한다.
# DB 공개 스냅샷을 받아 검사 → 자료 파일이 바뀌었으면 커밋 → 배포 워크플로 실행.
# 비밀 키 없이 공개(publishable) 키로만 읽는다. 검사에 실패하면 아무 파일도 바꾸지 않고 실패(기존 사이트 유지).
# 놓친 반영이 없도록 6시간마다도 한 번씩 대조한다. 손으로: Actions 탭 → 사이트 자료 반영 → Run workflow
name: 사이트 자료 반영

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: DB 스냅샷 받아 자료 파일 만들기
        run: node scripts/export-snapshot.mjs
      - name: 자료 검사
        run: |
          node scripts/check-records.mjs
      - name: 바뀌었으면 커밋하고 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 새로 생긴 파일(처음 만든 반영 버전 파일)도 잡히도록 먼저 add 한 뒤 비교
          git add src/data public/content-revision.json
          if git diff --cached --quiet; then
            # 자료는 이미 저장소에 있음. 그래도 공개 사이트 버전이 다르면(앞선 배포 실패 등) 같은 자료로 다시 배포
            # (2026-10-14 리뷰 1-4: 커밋은 됐는데 배포가 실패하면 다시 반영해도 복구되지 않던 문제)
            REPO_REV=$(node -p "require('./public/content-revision.json').revision")
            LIVE_REV=$(curl -fsS --max-time 15 "https://iin0ru.github.io/kgu_football/content-revision.json?t=$(date +%s)" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).revision)}catch{console.log('none')}})" || echo none)
            if [ "$LIVE_REV" != "$REPO_REV" ]; then
              echo "자료 변경 없음 · 공개 사이트 버전 $LIVE_REV ≠ 저장소 $REPO_REV → 다시 배포"
              gh workflow run deploy.yml --ref main
            else
              echo "변경 없음 · 공개 사이트도 최신 ($LIVE_REV)"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "관리자 입력 반영 (DB 버전 $(node -p "require('./public/content-revision.json').revision"))"
          git push
          # 봇이 한 push 는 다른 워크플로를 깨우지 않으므로 배포를 직접 실행 (workflow_dispatch 는 예외로 실행됨)
          gh workflow run deploy.yml --ref main
