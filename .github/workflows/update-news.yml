# 매일 아침 7시(한국 시간)에 축구부 네이버 블로그 RSS에서 새 글을 받아온다.
# 바뀐 게 있을 때만 커밋하고 배포 워크플로를 실행한다. 손으로 돌리려면 Actions 탭 → Run workflow
name: 소식 업데이트

on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = 한국 07:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 블로그 새 글 받아오기
        run: node scripts/fetch-news.mjs
      - name: 바뀌었으면 커밋하고 배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A src/data/news.json public/news
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "소식 자동 업데이트 (축구부 블로그)"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref main
