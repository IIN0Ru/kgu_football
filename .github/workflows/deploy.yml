name: Deploy to GitHub Pages

# main에 올라올 때마다 빌드해서 gh-pages 브랜치에 배포한다.
# (저장소 설정에서 Pages를 직접 켤 수 없어 gh-pages 브랜치 방식 사용)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 배포 전 검증: 하나라도 실패하면 배포하지 않음 (2026-10-19)
      - name: Lint
        run: npm run lint -- --deny-warnings
      - name: 날짜·시간 계산 시험
        run: |
          npm run check:time
          npm run check:calendar
      - name: 시즌 기록·붙여넣기 시험
        run: |
          npm run check:records
          npm run test:records
          npm run test:parse
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
