<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>KGU Football</title>
    <script>
      // GitHub Pages 는 /kgu_football/schedule 같은 주소를 이 파일로 보낸다.
      // 원래 주소를 기억해 두고 사이트 첫 파일로 넘기면, main.tsx 가 그 주소로 되돌린다 (같은 사이트 안 주소만)
      try {
        if (location.pathname.indexOf('/kgu_football/') === 0) {
          sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash)
        }
      } catch (e) {}
      location.replace('/kgu_football/')
    </script>
  </head>
  <body></body>
</html>
